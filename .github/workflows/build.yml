name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          # Windows
          - name: Windows
            os: windows-latest

          # macOS
          - name: macOS
            os: macos-latest

          # ios
          - name: iOS
            os: macos-latest
            target: iOS

          # Android
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
      
      # show compiler errors as annotations on the run page
      - uses: ammaraskar/gcc-problem-matcher@0.3.0
      - uses: ammaraskar/msvc-problem-matcher@0.3.0

      - name: Setup Latest CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          bindings: geode-sdk/bindings
          bindings-ref: main

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    if: ${{ !cancelled() }}

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}